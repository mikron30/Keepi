<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#5865F2">
  <meta name="description" content="Keepi minimal PWA baseline">
  <title>Keepi</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#0D1020;
      color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    main{
      width:min(92vw,520px);
      padding:32px;
      text-align:center;
    }
    img{
      width:128px;
      height:128px;
      border-radius:28px;
    }
    h1{
      margin:20px 0 8px;
      font-size:38px;
    }
    p{
      margin:0;
      color:#cfd3ff;
      font-size:18px;
      line-height:1.5;
    }
    button{
      width:100%;
      margin-top:24px;
      padding:16px 20px;
      border:0;
      border-radius:14px;
      background:#5865F2;
      color:#fff;
      font-size:19px;
      font-weight:800;
    }
    button:disabled{
      opacity:.45;
    }
    #status{
      margin-top:18px;
      min-height:24px;
      color:#ffcf70;
      font-size:14px;
    }
    #version{
      margin-top:24px;
      color:#7f89a9;
      font-size:12px;
    }
  </style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Keepi">
  <h1>Keepi</h1>
  <p>Minimal installable baseline.</p>
  <button id="install" disabled>Install Keepi</button>
  <div id="status">Preparing install…</div>
  <div id="version">baseline-v1</div>
</main>

<script>
let deferredPrompt = null;
const installButton = document.getElementById('install');
const status = document.getElementById('status');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredPrompt = event;
  installButton.disabled = false;
  status.textContent = 'Chrome says Keepi is installable.';
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  installButton.disabled = true;
  status.textContent = 'Keepi installed successfully.';
});

installButton.addEventListener('click', async () => {
  if (!deferredPrompt) return;

  const promptEvent = deferredPrompt;
  deferredPrompt = null;
  installButton.disabled = true;

  await promptEvent.prompt();
  const choice = await promptEvent.userChoice;
  status.textContent = 'Install choice: ' + choice.outcome;
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .then(() => navigator.serviceWorker.ready)
    .then(() => {
      if (!deferredPrompt) {
        status.textContent = 'Service worker ready. Waiting for Chrome install prompt…';
      }
    })
    .catch((error) => {
      status.textContent = 'Service worker error: ' + error;
    });
} else {
  status.textContent = 'Service workers are not supported in this browser.';
}
</script>
</body>
</html>
