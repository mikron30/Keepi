name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Node for Cloud Functions
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Function dependencies
        run: npm install --prefix functions

      - name: Check Cloud Function syntax
        run: npm run --prefix functions check
