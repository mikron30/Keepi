# AdMob-enabled native build
name: Mobile Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/images/keepi_icon_clean.webp.b64'
      - 'tool/generate_native_icons.dart'
      - '.github/workflows/mobile-builds.yml'

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Keepi native icons
        run: dart run tool/generate_native_icons.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        shell: bash
        run: |
          mapfile -t FIREBASE_DEFINES < <(dart run tool/print_firebase_defines.dart android)
          flutter build apk --release "${FIREBASE_DEFINES[@]}"

      - name: Android emulator smoke test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            sleep 20
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am force-stop com.mikron30.keepi
            adb shell monkey -p com.mikron30.keepi -c android.intent.category.LAUNCHER 1
            sleep 30
            echo "=== PACKAGE ===" | tee keepi-emulator-summary.txt
            adb shell dumpsys package com.mikron30.keepi | grep -E "versionName|versionCode|primaryCpuAbi|codePath" | tee -a keepi-emulator-summary.txt || true
            echo "=== PROCESS VIA PS ===" | tee -a keepi-emulator-summary.txt
            adb shell ps -A | grep "com.mikron30.keepi" | tee -a keepi-emulator-summary.txt
            echo "=== RESUMED ACTIVITY ===" | tee -a keepi-emulator-summary.txt
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|MainActivity" | tail -30 | tee -a keepi-emulator-summary.txt || true
            adb logcat -d -v threadtime > keepi-emulator-logcat.txt
            adb exec-out screencap -p > keepi-emulator-screen.png || true
            echo "=== KEEPI FATAL LINES ===" | tee -a keepi-emulator-summary.txt
            grep -E "FATAL EXCEPTION|Process: com.mikron30.keepi|Unable to instantiate|Unable to start activity|ClassNotFoundException|UnsatisfiedLinkError|SecurityException|Fatal signal" keepi-emulator-logcat.txt | tail -250 | tee -a keepi-emulator-summary.txt || true
            test -n "$(adb shell ps -A | grep "com.mikron30.keepi" || true)"
            adb shell dumpsys activity activities | grep -q "com.mikron30.keepi/.MainActivity"
            ! grep -qE "FATAL EXCEPTION|Process: com.mikron30.keepi|Fatal signal.*com.mikron30.keepi" keepi-emulator-logcat.txt
            echo "SMOKE TEST PASS: Keepi 0.1.12 production launcher is alive." | tee -a keepi-emulator-summary.txt

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepi-android-emulator-diagnostics
          path: |
            keepi-emulator-summary.txt
            keepi-emulator-logcat.txt
            keepi-emulator-screen.png
          if-no-files-found: warn

      - name: Build AAB
        shell: bash
        run: |
          mapfile -t FIREBASE_DEFINES < <(dart run tool/print_firebase_defines.dart android)
          flutter build appbundle --release "${FIREBASE_DEFINES[@]}"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: keepi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: keepi-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iPhone unsigned build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Keepi native icons
        run: dart run tool/generate_native_icons.dart

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Package iPhone app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app ../../../keepi-ios-unsigned.zip

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: keepi-ios-unsigned
          path: keepi-ios-unsigned.zip
          if-no-files-found: error
