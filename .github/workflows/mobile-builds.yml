# AdMob-enabled native build
name: Mobile Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/images/keepi_icon_clean.webp.b64'
      - 'tool/generate_native_icons.dart'
      - '.github/workflows/mobile-builds.yml'

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Keepi native icons
        run: dart run tool/generate_native_icons.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk || true
            adb logcat -c || true
            adb shell am force-stop com.mikron30.keepi || true
            adb shell am start -W -n com.mikron30.keepi/com.mikron30.keepi.KeepiDiagnosticActivity || true
            sleep 8

            # Capture the crash log FIRST so later diagnostics cannot hide it.
            adb logcat -d -v threadtime > keepi-emulator-logcat.txt || true
            adb exec-out screencap -p > keepi-emulator-screen.png || true

            echo "=== PACKAGE ===" | tee keepi-emulator-summary.txt
            adb shell dumpsys package com.mikron30.keepi | grep -E "versionName|versionCode|primaryCpuAbi|codePath" | tee -a keepi-emulator-summary.txt || true

            echo "=== PROCESS ===" | tee -a keepi-emulator-summary.txt
            adb shell pidof com.mikron30.keepi | tee -a keepi-emulator-summary.txt || true

            echo "=== RESUMED ACTIVITY ===" | tee -a keepi-emulator-summary.txt
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|KeepiDiagnosticActivity|MainActivity" | tail -30 | tee -a keepi-emulator-summary.txt || true

            echo "=== FATAL / ANDROIDRUNTIME ===" | tee -a keepi-emulator-summary.txt
            grep -E "FATAL EXCEPTION|AndroidRuntime|Process: com.mikron30.keepi|Caused by:|Unable to instantiate|Unable to start activity|ClassNotFoundException|UnsatisfiedLinkError|SecurityException" keepi-emulator-logcat.txt | tail -200 | tee -a keepi-emulator-summary.txt || true

            echo "=== FLUTTER STAGE ===" | tee -a keepi-emulator-summary.txt
            adb logcat -c || true
            adb shell am start -W -n com.mikron30.keepi/com.mikron30.keepi.MainActivity || true
            sleep 10
            adb logcat -d -v threadtime > keepi-flutter-logcat.txt || true

            echo "=== FLUTTER PROCESS ===" | tee -a keepi-emulator-summary.txt
            adb shell pidof com.mikron30.keepi | tee -a keepi-emulator-summary.txt || true

            echo "=== FLUTTER RESUMED ACTIVITY ===" | tee -a keepi-emulator-summary.txt
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|KeepiDiagnosticActivity|MainActivity" | tail -30 | tee -a keepi-emulator-summary.txt || true

            echo "=== FLUTTER FATAL / ANDROIDRUNTIME ===" | tee -a keepi-emulator-summary.txt
            grep -E "FATAL EXCEPTION|AndroidRuntime|Process: com.mikron30.keepi|Caused by:|Unable to instantiate|Unable to start activity|ClassNotFoundException|UnsatisfiedLinkError|SecurityException|flutter" keepi-flutter-logcat.txt | tail -250 | tee -a keepi-emulator-summary.txt || true

            adb exec-out screencap -p > keepi-flutter-screen.png || true

            adb shell uiautomator dump /data/local/tmp/keepi-window.xml || true
            adb pull /data/local/tmp/keepi-window.xml keepi-window.xml || true

            echo "=== UI TEXT ===" | tee -a keepi-emulator-summary.txt
            test ! -f keepi-window.xml || grep -o 'text="[^"]*"' keepi-window.xml | tee -a keepi-emulator-summary.txt || true

            echo "=== FLUTTER STARTUP TEST ===" | tee -a keepi-emulator-summary.txt

            # The emulator can occasionally show its own System UI ANR dialog.
            # Select "Wait" and continue; this is not a Keepi crash.
            adb shell input tap 540 1332 || true
            sleep 2

            adb shell uiautomator dump /data/local/tmp/keepi-native.xml || true
            adb pull /data/local/tmp/keepi-native.xml keepi-native.xml || true

            if [ -f keepi-native.xml ] && grep -q "START FLUTTER DIAGNOSTICS" keepi-native.xml; then
              bounds=$(grep -o 'text="START FLUTTER DIAGNOSTICS"[^>]*bounds="\[[0-9,]*\]\[[0-9,]*\]"' keepi-native.xml | head -1 | grep -o 'bounds="[^"]*"' | cut -d'"' -f2)
              coords=$(echo "$bounds" | tr -d '[]' | tr ',' ' ' | tr '][' ' ')
              set -- $coords
              x=$(( ($1 + $3) / 2 ))
              y=$(( ($2 + $4) / 2 ))

              adb logcat -c || true
              adb shell input tap "$x" "$y" || true
              sleep 12

              adb logcat -d -v threadtime > keepi-flutter-logcat.txt || true
              adb exec-out screencap -p > keepi-flutter-screen.png || true
              adb shell uiautomator dump /data/local/tmp/keepi-flutter.xml || true
              adb pull /data/local/tmp/keepi-flutter.xml keepi-flutter.xml || true

              echo "--- Flutter process ---" | tee -a keepi-emulator-summary.txt
              adb shell pidof com.mikron30.keepi | tee -a keepi-emulator-summary.txt || true

              echo "--- Flutter resumed activity ---" | tee -a keepi-emulator-summary.txt
              adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|MainActivity|KeepiDiagnosticActivity" | tail -30 | tee -a keepi-emulator-summary.txt || true

              echo "--- Flutter fatal lines ---" | tee -a keepi-emulator-summary.txt
              grep -E "FATAL EXCEPTION|AndroidRuntime|Process: com.mikron30.keepi|Caused by:|ClassNotFoundException|UnsatisfiedLinkError|SecurityException" keepi-flutter-logcat.txt | tail -200 | tee -a keepi-emulator-summary.txt || true

              echo "--- Flutter UI text ---" | tee -a keepi-emulator-summary.txt
              test ! -f keepi-flutter.xml || grep -o 'text="[^"]*"' keepi-flutter.xml | tee -a keepi-emulator-summary.txt || true
            else
              echo "Could not find START FLUTTER DIAGNOSTICS button." | tee -a keepi-emulator-summary.txt
            fi

            exit 0

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepi-android-emulator-diagnostics
          path: |
            keepi-emulator-summary.txt
            keepi-emulator-logcat.txt
            keepi-emulator-screen.png
            keepi-flutter-screen.png
            keepi-flutter-logcat.txt
            keepi-window.xml
            keepi-native.xml
            keepi-flutter-logcat.txt
            keepi-flutter-screen.png
            keepi-flutter.xml
          if-no-files-found: warn

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: keepi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: keepi-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iPhone unsigned build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Keepi native icons
        run: dart run tool/generate_native_icons.dart

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Package iPhone app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app ../../../keepi-ios-unsigned.zip

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: keepi-ios-unsigned
          path: keepi-ios-unsigned.zip
          if-no-files-found: error
