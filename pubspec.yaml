name: keepi
description: Universal private inventory and local marketplace for Things.
publish_to: 'none'
version: 0.1.13+13

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.6.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  image_picker: ^1.2.3
  image: ^4.5.4
  google_sign_in: ^7.2.0
  google_mobile_ads: ^9.1.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/keepi_icon.png
