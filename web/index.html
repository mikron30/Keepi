<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Keepi - know what you have, what it is worth, and who nearby needs it.">
  <meta name="theme-color" content="#5865F2">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Keepi">
  <link rel="apple-touch-icon" href="/icons/keepi-192.png">
  <link rel="icon" type="image/png" href="/icons/keepi-192.png">

  <title>Keepi</title>
  <link rel="manifest" href="/app.webmanifest">

  <style>
    #keepi-install-button {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: none;
      min-width: 190px;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: #FF634D;
      color: #ffffff;
      font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
      cursor: pointer;
    }

    #keepi-install-button:active {
      transform: translateX(-50%) scale(.98);
    }
  </style>

  <script>
    window.keepiDeferredInstallPrompt = null;
    window.keepiInstallPromptSeen = false;

    function keepiIsStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    }

    function keepiRefreshInstallButton() {
      const button = document.getElementById('keepi-install-button');
      if (!button) return;

      button.style.display =
        window.keepiDeferredInstallPrompt && !keepiIsStandalone()
          ? 'block'
          : 'none';
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      // Use the same flow that succeeded on the PWA debug page:
      // save Chrome's install event and invoke it from our own button.
      event.preventDefault();
      window.keepiDeferredInstallPrompt = event;
      window.keepiInstallPromptSeen = true;
      keepiRefreshInstallButton();
      window.dispatchEvent(new Event('keepi-install-ready'));
    });

    window.addEventListener('appinstalled', () => {
      window.keepiDeferredInstallPrompt = null;
      keepiRefreshInstallButton();
      window.dispatchEvent(new Event('keepi-app-installed'));
    });

    window.addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('keepi-install-button');

      if (button) {
        button.addEventListener('click', async () => {
          const prompt = window.keepiDeferredInstallPrompt;
          if (!prompt) return;

          window.keepiDeferredInstallPrompt = null;
          keepiRefreshInstallButton();

          try {
            await prompt.prompt();
            await prompt.userChoice;
          } catch (error) {
            console.warn('Keepi install prompt failed:', error);
          }
        });
      }

      keepiRefreshInstallButton();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .catch((error) => {
            console.warn('Keepi service worker registration failed:', error);
          });
      });
    }
  </script>
</head>
<body>
  <button id="keepi-install-button" type="button">Install Keepi</button>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
