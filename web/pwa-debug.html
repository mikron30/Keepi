<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#5865F2">
  <title>Keepi PWA Debug</title>
  <style>
    body{margin:0;background:#0D1020;color:#fff;font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:760px;margin:auto;padding:20px}
    h1{font-size:28px;margin:0 0 8px} p{color:#cfd3ff}
    button{width:100%;padding:14px;border:0;border-radius:12px;background:#5865F2;color:white;font-weight:800;font-size:16px;margin:10px 0 18px}
    .row{padding:12px;border-radius:12px;background:#15192A;margin:8px 0}
    .ok{border-left:5px solid #65d98b}.bad{border-left:5px solid #ff7474}.wait{border-left:5px solid #e8c76c}
    .name{font-weight:800}.detail{margin-top:5px;color:#b8c0df;white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
<main>
  <h1>Keepi PWA Debug</h1>
  <p>Checks what Chrome on this phone actually receives.</p>
  <button id="run">Run checks again</button>
  <div id="results"></div>
</main>
<script>
const results=document.getElementById('results');
function row(name,status,detail){
  const d=document.createElement('div');
  d.className='row '+(status===true?'ok':status===false?'bad':'wait');
  const n=document.createElement('div'); n.className='name';
  n.textContent=(status===true?'OK — ':status===false?'X — ':'… — ')+name;
  const x=document.createElement('div'); x.className='detail'; x.textContent=detail||'';
  d.append(n,x); results.appendChild(d);
}
async function fetchText(url){
  const r=await fetch(url,{cache:'no-store'});
  return {status:r.status,ok:r.ok,type:r.headers.get('content-type')||'',text:await r.text()};
}
async function run(){
  results.innerHTML='';
  row('Page URL',true,location.href);
  row('Secure context',window.isSecureContext,'isSecureContext='+window.isSecureContext);

  try{
    const m=await fetchText('/app/manifest.json?debug='+Date.now());
    let parsed=null,err='';
    try{parsed=JSON.parse(m.text)}catch(e){err=String(e)}
    row('Manifest',m.ok&&!!parsed,
      'HTTP '+m.status+'\nContent-Type: '+m.type+'\n'+
      (parsed?JSON.stringify({id:parsed.id,start_url:parsed.start_url,scope:parsed.scope,display:parsed.display,icons:parsed.icons},null,2):('JSON error: '+err+'\n'+m.text.slice(0,180))));
  }catch(e){row('Manifest',false,String(e))}

  try{
    const s=await fetchText('/app/sw.js?debug='+Date.now());
    const looksJs=s.text.includes("addEventListener('fetch'")||s.text.includes('addEventListener("fetch"');
    row('Service worker file',s.ok&&looksJs,
      'HTTP '+s.status+'\nContent-Type: '+s.type+'\nLooks like SW JavaScript: '+looksJs+'\nFirst bytes: '+s.text.slice(0,180));
  }catch(e){row('Service worker file',false,String(e))}

  if(!('serviceWorker' in navigator)){
    row('Service Worker API',false,'navigator.serviceWorker unavailable');
    return;
  }
  row('Service Worker API',true,'available');

  try{
    const oldRegs=await navigator.serviceWorker.getRegistrations();
    row('Registrations before',null,oldRegs.length?oldRegs.map(r=>'scope='+r.scope+' | active='+(r.active&&r.active.scriptURL)).join('\n'):'none');

    const appScope=new URL('/app/',location.origin).href;
    await Promise.all(oldRegs.filter(r=>r.scope!==appScope).map(r=>r.unregister()));

    const reg=await navigator.serviceWorker.register('/app/sw.js?v=4',{scope:'/app/',updateViaCache:'none'});
    row('Register /app/sw.js',true,'scope='+reg.scope);

    await reg.update();
    await new Promise(r=>setTimeout(r,1500));

    const regs=await navigator.serviceWorker.getRegistrations();
    row('Registrations after',true,regs.map(r=>'scope='+r.scope+'\nactive='+(r.active&&r.active.scriptURL)+'\nwaiting='+(r.waiting&&r.waiting.scriptURL)+'\ninstalling='+(r.installing&&r.installing.scriptURL)).join('\n\n'));

    try{
      await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((_,reject)=>setTimeout(()=>reject(new Error('ready timeout after 5 seconds')),5000))
      ]);
      row('Service worker ready',true,'navigator.serviceWorker.ready resolved');
    }catch(e){row('Service worker ready',false,String(e))}

    row('Current controller',!!navigator.serviceWorker.controller,
      navigator.serviceWorker.controller?navigator.serviceWorker.controller.scriptURL:'none — reload this page once');
  }catch(e){
    row('Register service worker',false,String(e&& (e.stack||e.message||e)));
  }

  row('Standalone mode',null,window.matchMedia('(display-mode: standalone)').matches?'yes':'no');
  row('Browser',null,navigator.userAgent);
}
document.getElementById('run').addEventListener('click',run);
run();
</script>
</body>
</html>
